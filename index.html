<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9d9c4">
<title>دعوة زفاف هبة ومحمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#e9d9c4;color:#633c3c}
body{font-family:'Amiri',serif}
.stage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#d9c4aa;line-height:0}
.cover{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}
.seal-hit,.hint{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seal-hit{left:50%;top:50.5%;transform:translate(-50%,-50%);width:25%;height:13%;border-radius:50%}
.hint{left:0;right:0;top:68%;height:19%}
.seal-hit:focus-visible,.hint:focus-visible{outline:2px solid #78484a;outline-offset:-5px}
.overlay{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));background:#34241fdc;backdrop-filter:blur(5px);overflow-y:auto}
.overlay.show{display:flex;animation:fade .35s ease}
.card{position:relative;width:min(94vw,490px);max-height:calc(100dvh - 28px);overflow:auto;text-align:center;padding:clamp(30px,6vh,54px) clamp(22px,6vw,38px) 28px;color:#684b45;background-color:#f7efdf;background-image:radial-gradient(ellipse at 15% 18%,#fff9e9 0 1px,transparent 2px),radial-gradient(ellipse at 80% 70%,#dfcdb8 0 1px,transparent 2px),repeating-linear-gradient(0deg,#ffffff18 0 1px,#b69a7b0b 1px 3px),linear-gradient(135deg,#fffaf0,#efe1cf 55%,#fbf3e6);border:1px solid #c9aa91;box-shadow:0 20px 70px #160e0c70, inset 0 0 0 5px #f7efdf,inset 0 0 0 7px #d7c1a8,inset 0 0 0 10px #f7efdf;outline:1px solid #c6a98f;outline-offset:5px;animation:rise .65s cubic-bezier(.2,.8,.2,1)}
.card:before,.card:after{content:'❧  ❀  ❧';display:block;color:#a77b70;font-family:Georgia,serif;font-size:22px;letter-spacing:5px;opacity:.8}
.card:before{margin-bottom:10px}.card:after{margin-top:18px}
.small{font-family:'Amiri',serif;font-size:16px;color:#98766a;margin:8px 0 14px}
.names{font-family:'Aref Ruqaa','Amiri',serif;font-size:clamp(46px,11vw,66px);font-weight:700;line-height:1.45;color:#713f43;margin:10px 0 2px}
.amp{font-family:'Aref Ruqaa',serif;font-size:.72em;color:#a77b70;padding:0 7px}
.date{font-family:'Aref Ruqaa','Amiri',serif;font-size:29px;color:#8b5e5c;margin:2px 0 15px}
.rule{width:62%;height:1px;background:linear-gradient(90deg,transparent,#c6a58f,transparent);margin:15px auto}
.dua{font-family:'Amiri',serif;font-size:clamp(19px,5vw,23px);font-weight:400;line-height:2.05;color:#654b45;margin:12px auto 4px;max-width:390px}
.close{margin-top:20px;border:1px solid #9b7168;background:#f8f0e5;color:#71494a;padding:9px 23px;border-radius:2px;font-family:'Amiri',serif;font-size:16px;cursor:pointer}
.close:active{background:#ead9c9}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-height:680px){.card{padding-top:22px;padding-bottom:18px}.dua{line-height:1.75}.card:after{margin-top:8px}.close{margin-top:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
